<script>
    // Mobile navigation toggle
    document.addEventListener('DOMContentLoaded', function() {
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
        
        // Toggle main navigation
        if (navToggle && navMenu) {
            navToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                navMenu.classList.toggle('active');
                navToggle.querySelector('i').className = navMenu.classList.contains('active') 
                    ? 'fas fa-times' 
                    : 'fas fa-bars';
            });
            
            // Close navigation when clicking outside
            document.addEventListener('click', function(e) {
                if (!navToggle.contains(e.target) && !navMenu.contains(e.target)) {
                    navMenu.classList.remove('active');
                    navToggle.querySelector('i').className = 'fas fa-bars';
                    // Also close all dropdowns
                    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
                }
            });
        }
        
        // Handle dropdown toggles for mobile
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    e.stopPropagation();
                    const dropdown = this.parentElement;
                    dropdown.classList.toggle('active');
                    
                    // Close other dropdowns
                    document.querySelectorAll('.dropdown').forEach(d => {
                        if (d !== dropdown) {
                            d.classList.remove('active');
                        }
                    });
                }
            });
        });
        
        // Set active link based on current page
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navLinks = document.querySelectorAll('.nav-link');
        const dropdownItems = document.querySelectorAll('.dropdown-item');
        
        // Function to check if link is active
        function isActiveLink(linkHref, currentPage) {
            if (linkHref === currentPage) return true;
            if (currentPage === 'index.html' && (linkHref === '' || linkHref === 'index.html')) return true;
            if (currentPage === '' && linkHref === 'index.html') return true;
            
            // Check for tool pages
            const toolPages = ['pdf-to-images.html', 'image-to-pdf.html', 'merge-pdf.html'];
            for (const toolPage of toolPages) {
                if (currentPage.includes(toolPage) && linkHref.includes(toolPage)) return true;
            }
            
            return false;
        }
        
        // Set active state for main nav links
        navLinks.forEach(link => {
            const linkHref = link.getAttribute('href');
            if (isActiveLink(linkHref, currentPage)) {
                link.classList.add('active');
                
                // If this is a dropdown toggle, also activate parent dropdown
                if (link.classList.contains('dropdown-toggle')) {
                    link.parentElement.classList.add('active');
                }
            }
        });
        
        // Set active state for dropdown items
        dropdownItems.forEach(item => {
            const itemHref = item.getAttribute('href');
            if (isActiveLink(itemHref, currentPage)) {
                item.classList.add('active');
                
                // Also activate parent dropdown and its toggle
                const dropdown = item.closest('.dropdown');
                if (dropdown) {
                    dropdown.classList.add('active');
                    const toggle = dropdown.querySelector('.dropdown-toggle');
                    if (toggle) toggle.classList.add('active');
                }
            }
        });
        
        // Show/hide mobile GitHub button
        function updateMobileButtons() {
            const mobileBtn = document.querySelector('.mobile-only');
            if (window.innerWidth <= 768) {
                mobileBtn.style.display = 'inline-flex';
                document.querySelector('.github-btn:not(.mobile-only)').style.display = 'none';
            } else {
                mobileBtn.style.display = 'none';
                document.querySelector('.github-btn:not(.mobile-only)').style.display = 'inline-flex';
            }
        }
        
        updateMobileButtons();
        window.addEventListener('resize', updateMobileButtons);
        
        // Handle keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                navMenu.classList.remove('active');
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
                if (navToggle) {
                    navToggle.querySelector('i').className = 'fas fa-bars';
                }
            }
        });
    });
</script>
